config-version = 2

after-startup-command = [
    'exec-and-forget /opt/homebrew/bin/sketchybar',
    'exec-and-forget /opt/homebrew/bin/borders',

    # Root container layouts are created once and then persist for the whole session
    # (even when the workspace becomes empty), so `default-root-container-layout`
    # does not retroactively fix existing workspaces. Force accordion on every start.
    'layout --workspace 1.Browser --root accordion',
    'layout --workspace 2.Code --root accordion',
    'layout --workspace 3.Chat --root accordion',
    'layout --workspace 4.ScratchPad --root accordion',
]

exec-on-workspace-change = [
    '/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true 

auto-reload-config = true 

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 50 

default-root-container-layout = 'accordion'

default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1.Browser", "2.Code", "3.Chat", "4.ScratchPad" ]

on-window-detected = [
    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox',
        run = 'move-node-to-workspace 1.Browser',
    },
]

on-mode-changed = []

focus-follows-mouse.enabled = false

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen --no-outer-gaps'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-n = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next'
    alt-p = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-prev'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1.Browser'
    alt-2 = 'workspace 2.Code'
    alt-3 = 'workspace 3.Chat'
    alt-4 = 'workspace 4.ScratchPad'

    alt-shift-1 = 'move-node-to-workspace 1.Browser'
    alt-shift-2 = 'move-node-to-workspace 2.Code'
    alt-shift-3 = 'move-node-to-workspace 3.Chat'
    alt-shift-4 = 'move-node-to-workspace 4.ScratchPad'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'layout --root accordion', 'mode main'] # reset layout to a flat accordion
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']


    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
