config-version = 2

after-startup-command = [
    # Status bar, configured in ~/.config/sketchybar (the `sketchybar` stow
    # package). It replaces the macOS menu bar, which is hidden here.
    'exec-and-forget /opt/homebrew/bin/sketchybar',
]

# The bar has no way to know a workspace changed, so tell it. The env vars are
# aerospace's own, and the command runs with a bare PATH -- hence /bin/bash and
# the absolute path to sketchybar.
exec-on-workspace-change = [
    '/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true 

auto-reload-config = true 

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1.Browser", "2.Code", "3.Chat", "4.ScratchPad" ]

on-window-detected = [
    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox',
        run = 'move-node-to-workspace 1.Browser',
    },
    {
        if = 'test %{workspace} = 2.Code',
        run = 'layout h_accordion',
    },
]

on-mode-changed = []

focus-follows-mouse.enabled = true 

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
# Sketchybar floats over the windows rather than reserving space, so this has
# to clear its height (32 in sketchybarrc) by hand.
gaps.outer.top =        32
gaps.outer.right =      0

[mode.main.binding]

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen --no-outer-gaps'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1.Browser'
    alt-2 = 'workspace 2.Code'
    alt-3 = 'workspace 3.Chat'
    alt-4 = 'workspace 4.ScratchPad'

    alt-shift-1 = 'move-node-to-workspace 1.Browser'
    alt-shift-2 = 'move-node-to-workspace 2.Code'
    alt-shift-3 = 'move-node-to-workspace 3.Chat'
    alt-shift-4 = 'move-node-to-workspace 4.ScratchPad'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']


    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
