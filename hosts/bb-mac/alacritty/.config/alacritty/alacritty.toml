[general]
import = ["~/.config/alacritty/base.toml"]

[terminal]
# -l makes it a login shell so .zprofile runs; without it, an Alacritty
# launched from Raycast/Finder inherits launchd's bare PATH and never
# picks up brew or ~/.local/bin.
shell = { program = "/bin/zsh", args = ["-l"] }

[font]
normal = { family = "Iosevka Term", style = "Medium" }
size = 20 

[window]
opacity = 0.96
startup_mode = "Maximized"
decorations="None"

[window.padding]
x = 10
y = 10



