config-version = 2

after-startup-command = []

start-at-login = true 

auto-reload-config = true 

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1.Browser", "2.Code", "3.Docs", "4.Chat", "5.ScratchPad", "6.Media" ]

on-window-detected = [
    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox || test %{app-bundle-id} = com.google.Chrome',
        run = 'move-node-to-workspace 1.Browser',
    },

    {
        if = 'test %{app-bundle-id} = notion.id || test %{app-bundle-id} = md.obsidian || test %{app-bundle-id} = com.linear',
        run = 'move-node-to-workspace 3.Docs',
    },

    {
        if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap',
        run = ['move-node-to-workspace 4.Chat', 'layout v_accordion'],
    },

    {
        if = 'test %{app-bundle-id} = com.github.th-ch.youtube-music',
        run = 'move-node-to-workspace 6.Media',
    },

    {
        if = 'test %{workspace} = 2.Code || test %{workspace} = 4.Chat',
        run = 'layout v_accordion',
    },
]

on-mode-changed = []

focus-follows-mouse.enabled = false 

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f = 'fullscreen --no-outer-gaps'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-n = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next'
    alt-p = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-prev'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1.Browser'
    alt-2 = 'workspace 2.Code'
    alt-3 = 'workspace 3.Docs'
    alt-q = 'workspace 4.Chat'
    alt-w = 'workspace 5.ScratchPad'
    alt-e = 'workspace 6.Media'

    alt-shift-1 = 'move-node-to-workspace 1.Browser'
    alt-shift-2 = 'move-node-to-workspace 2.Code'
    alt-shift-3 = 'move-node-to-workspace 3.Docs'
    alt-shift-q = 'move-node-to-workspace 4.Chat'
    alt-shift-w = 'move-node-to-workspace 5.ScratchPad'
    alt-shift-e = 'move-node-to-workspace 6.Media'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']


    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
