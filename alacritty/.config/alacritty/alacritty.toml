
[env]
TERM = "xterm-256color"

[terminal]
shell={program="/bin/zsh", args=["-l", "-c", "zellij"]}


[font]
normal = { family = "Iosevka", style = "Thin,Regular" }
size = 13.5

[window]
dynamic_title = true
opacity = 1 

[window.padding]
x = 1
y = 1

[general]
live_config_reload = true


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
