
[env]
TERM = "xterm-256color"

[terminal]
shell={program="/bin/zsh", args=[]}


[font]
normal = { family = "Iosevka", style = "Thin,Regular" }
size = 13.5

[window]
dynamic_title = true
opacity = 1 

[window.padding]
x = 5
y = 10

[general]
live_config_reload = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
