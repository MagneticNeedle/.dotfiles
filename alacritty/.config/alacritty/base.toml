# Shared Alacritty settings. The real alacritty.toml comes from the host's
# stow package under hosts/<name>/alacritty; it imports this file and layers
# font, shell, and window settings on top (the importing file wins).

[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

[window]
dynamic_title = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
